<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Mega Auth OIDC</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="w-full max-w-md p-8 space-y-6 bg-white rounded-xl shadow-lg">
      <div class="text-center">
        <h1 class="text-3xl font-bold text-gray-900">Sign in</h1>
        <p class="mt-2 text-sm text-gray-600">
          Enter your details to access your account
        </p>
      </div>

      <form id="loginForm" class="space-y-5">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700"
            >Email Address</label
          >
          <input
            type="email"
            id="email"
            name="email"
            required
            class="w-full px-4 py-2 mt-1 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition-colors"
            placeholder="you@example.com"
          />
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700"
            >Password</label
          >
          <input
            type="password"
            id="password"
            name="password"
            required
            class="w-full px-4 py-2 mt-1 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition-colors"
            placeholder="••••••••"
          />
        </div>

        <div id="message" class="hidden text-sm text-center mt-2"></div>

        <button
          type="submit"
          class="w-full px-4 py-2 text-white bg-blue-600 rounded-lg hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 font-medium transition-colors"
        >
          Sign In
        </button>
      </form>
    </div>

    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;
          const submitButton = e.target.querySelector('button[type="submit"]');
          const messageDiv = document.getElementById("message");

          // Reset message & UI state
          messageDiv.classList.remove("hidden");
          messageDiv.className = "text-sm text-center text-gray-600 mt-2";
          messageDiv.textContent = "Connecting...";
          submitButton.disabled = true;
          submitButton.textContent = "Signing in...";

          try {
            const response = await fetch("/login", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ email, password }),
            });

            if (response.ok) {
              const data = await response.json();
              messageDiv.textContent = "Login successful!";
              messageDiv.className = "text-sm text-center text-green-600 mt-2";
              if (data.redirectTo) {
                window.location.href = data.redirectTo;
              }
            } else {
              const data = await response.json().catch(() => ({}));
              messageDiv.textContent =
                data.message || "Login failed. Please check your credentials.";
              messageDiv.className = "text-sm text-center text-red-600 mt-2";
            }
          } catch (error) {
            messageDiv.textContent =
              "An error occurred connecting to the server.";
            messageDiv.className = "text-sm text-center text-red-600 mt-2";
          } finally {
            submitButton.disabled = false;
            submitButton.textContent = "Sign In";
          }
        });
    </script>
  </body>
</html>
